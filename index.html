// ฝั่งอาจารย์: แถวของชิ้นงานความเร็ว (คะแนนอัตโนมัติคำนวณใหม่จากเกณฑ์ปัจจุบันทุกครั้ง)
function spdRows(){return tData.spd.map(x=>{const g=tData.spdg[x.id]||null,pro=x.level!=='new',auto=speedAuto(x.rows,pro,x.pb);
  return{key:'s:'+x.id,kind:'s',id:x.id,title:x.student||t('noName'),x,pro,grade:g,auto,rub:rubricPct(g),fin:finalScore(auto,g),time:x.submittedAt,stale:!!(g&&g.at&&x.submittedAt>g.at)}})}
const spdTotal=rows=>(rows||[]).reduce((a,q)=>{const n=sNum(q.reps),d=sNum(q.d),S=sNum(q.sets)||1;return a+(n&&d?n*d*S:0)},0);
function teacherRowS(r){
  const open=tv.open.has(r.key),x=r.x;
  const status=r.rub!=null?(r.stale?`<span class="pill warn">${t('resub')}</span>`:`<span class="pill ok">${t('graded')}</span>`):`<span class="pill">${t('notGraded')}</span>`;
  const meta=[`${t('tSubmittedAt')} ${esc(fmtTime(r.time))}`,`${esc(sT('pb'))}: ${esc(x.pb||'-')}`,esc(r.pro?sT('lvPro'):sT('lvNew'))].join(' · ');
  return `<article class="grow">
    <div class="grow-top"><div style="min-width:0"><h3>${esc(r.title)} ${status}</h3><div class="gmeta">${meta}</div>
      <div class="prog"><span>${esc(sT('totAll'))} ${spdTotal(x.rows)} m · ${(x.rows||[]).length} ${esc(sT('nDrills'))}</span></div></div>
      <div><div class="scores"><div><span>${t('autoS')}</span><strong style="color:${scoreCol(r.auto)}">${r.auto}</strong></div>
        <div><span>${t('teachS')}</span><strong>${r.rub??'–'}</strong></div><div><span>${t('finalS')}</span><strong style="color:${r.fin!=null?scoreCol(r.fin):'inherit'}">${r.fin??'–'}</strong></div></div>
      <div class="grow-btns"><button class="btn small" data-open="${esc(r.key)}" aria-expanded="${open}">${open?t('tHide'):t('tView')}</button>
      <button class="btn small danger" data-delg="${esc(r.key)}">${tv.delArm===r.key?t('tDelC'):t('tDel')}</button></div></div></div>
    ${open?spdDetail(r)+rubricForm(r,sT('rub')):''}</article>`;
}
function spdDetail(r){const x=r.x,T2=sT('t'),E2=sT('es');
  return `<div class="sw-tv">${(x.rows||[]).map(q=>{const res=sCheck(q,r.pro,x.pb),nt=r.pro?(q.nt||'—'):(sNotation(q)||'—');
    return `<div class="sw-tvr"><div><b>${esc(T2[q.t]||q.t)}</b> · ${esc(q.ex||'-')}</div><div class="sw-nt"><code>${esc(nt)}</code><span>${esc(E2[esN(q.es)]||'-')}</span></div>${r.pro?esMixBar(q):''}
      <ul class="sw-fb">${res.out.map(([k,m])=>`<li class="${k}">${esc(m)}</li>`).join('')}</ul></div>`}).join('')}</div>`}
function renderSpeedTotals(){const el=document.getElementById('sw-tot');if(!el)return;const sp=local.spd;let tot=0,rest=0;
  sp.rows.forEach(r=>{const n=sNum(r.reps),d=sNum(r.d),S=sNum(r.sets)||1;if(n&&d)tot+=n*d*S;const rr=isHR(r)?null:sRest(r.r),sr=sRest(r.sr);if(n&&rr)rest+=((rr[0]+rr[1])/2)*Math.max(0,n-1)*S;if(S>1&&sr)rest+=((sr[0]+sr[1])/2)*(S-1)});
  el.innerHTML=`<span>${esc(sT('totAll'))} <b>${tot}</b> m</span><span>${esc(sT('restAll'))} <b>${Math.round(rest)}</b> ${esc(sT('min'))}</span>`}
// สลับระหว่าง "แผน 7 วัน" กับ "ชิ้นงาน: ความเร็ว" (ซ่อนส่วนของอีกงานไว้ ข้อมูลไม่หาย)
function applyWs(){
  const T=local.mode==='teacher',sp=local.ws==='speed'&&!T;
  document.getElementById('wsSeg').hidden=T;
  document.querySelectorAll('#wsSeg [data-ws]').forEach(b=>{b.textContent=sT(b.dataset.ws==='plan'?'wsPlan':'wsSpeed');b.setAttribute('aria-pressed',local.ws===b.dataset.ws)});
  document.getElementById('wsSpeed').hidden=!sp;
  if(T)return;
  // โหมดแผน: renderAll ตั้งค่าการแสดงผลไว้แล้ว ไม่ต้องแตะ; โหมดชิ้นงาน: ซ่อนส่วนของแผน 7 วัน
  if(sp){['steps','who','mc','work','planActions','eval','fb'].forEach(id=>{const e=document.getElementById(id);if(e)e.hidden=true});renderSpeed()}
  else document.getElementById('work').hidden=false; // ส่วนอื่น renderAll คืนค่าให้แล้ว แต่กล่อง work ไม่อยู่ในรายการของ renderAll
}
document.querySelectorAll('#wsSeg [data-ws]').forEach(b=>b.onclick=()=>{local.ws=b.dataset.ws;saveLocal();renderAll();window.scrollTo({top:0})});

function renderAll(){
  renderStatic();
  const T=local.mode==='teacher';
  ['who','mc','tools','viewBar','boardWrap','sum','planActions','steps'].forEach(id=>document.getElementById(id).hidden=T);
  document.getElementById('teacher').hidden=!T;
  if(T){document.getElementById('eval').hidden=true;document.getElementById('fb').hidden=true;renderTeacher();applyWs();return}
  renderWho();renderFeedback();renderProfile();renderLib();renderPalettes();renderBoard();
  if(!document.getElementById('eval').hidden)renderEval();
  applyWs();
}
renderAll();

/* ================= capabilities: db (ข้อมูลกลาง) + user (สิทธิ์อาจารย์/ไอดีนักศึกษา) ================= */
(async()=>{
  const use=async n=>{try{return window.claude?await window.claude.use(n):null}catch(e){return null}};
  const [dbNs,userNs]=await Promise.all([use('db'),use('user')]);
  db=dbNs;userCap=userNs;
  if(userCap){try{canTeach=!!((await userCap.isOwner())||(await userCap.canEdit()))}catch(e){canTeach=false}
    try{uid=await userCap.id()}catch(e){uid=null}}
  if(!canTeach&&local.mode==='teacher'){local.mode='indiv';saveLocal()}
  capsReady=true;
  // ไม่มีข้อมูลกลาง (ไม่ได้ลงชื่อเข้าใช้ หรือเปิดลิงก์ฉบับไม่ต้องลงชื่อ): ใช้ได้เฉพาะรายบุคคล ส่งงานด้วยการคัดลอกแผน
  if(!db){if(local.mode==='group'){local.mode='indiv';saveLocal()}renderAll();return}
  syncState='live';
  db.collection('groups').onSnapshot(snap=>{
    groupsList=snap.docs.map(d=>{const x=d.data();return{code:d.id,...groupFromDoc(x),updatedAt:x.updatedAt||0}});
    renderGroupsList();if(local.mode==='teacher')renderTeacher();
  },()=>{});
  if(uid){
    db.doc('indiv/'+uid).onSnapshot(s=>{mySub=s.exists?s.data():null;renderSubmitStatus();renderFeedback()},()=>{});
    db.doc('grades/'+uid).onSnapshot(s=>{myGrade=s.exists?s.data():null;renderFeedback()},()=>{});
    db.doc('wsspeed/'+uid).onSnapshot(s=>{mySpd=s.exists?s.data():null;renderSpeedSub()},()=>{});
    db.doc('wsgspeed/'+uid).onSnapshot(s=>{mySpdG=s.exists?s.data():null;renderSpeedSub()},()=>{});
  }
  if(canTeach){
    db.collection('indiv').onSnapshot(s=>{tData.indiv=s.docs.map(d=>{const x=d.data();return{id:d.id,student:x.student||'',context:x.context||'',submittedAt:x.submittedAt||0,days:normDays(x.days),profile:normProfile(x.profile)}});if(local.mode==='teacher')renderTeacher()},()=>{});
    db.collection('grades').onSnapshot(s=>{tData.grades=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(local.mode==='teacher')renderTeacher()},()=>{});
    db.collection('ggrades').onSnapshot(s=>{tData.ggrades=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(local.mode==='teacher')renderTeacher()},()=>{});
    db.collection('wsspeed').onSnapshot(s=>{tData.spd=s.docs.map(d=>{const x=d.data();return{id:d.id,student:x.student||'',pb:x.pb||'',level:x.level==='new'?'new':'pro',rows:Array.isArray(x.rows)?x.rows:[],submittedAt:x.submittedAt||0}});if(local.mode==='teacher')renderTeacher()},()=>{});
    db.collection('wsgspeed').onSnapshot(s=>{tData.spdg=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(local.mode==='teacher')renderTeacher()},()=>{});
  }
  if(local.mode==='group'&&group.code)joinGroup(group.code);else renderAll();
})();
</script>
</body></html>
