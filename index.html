<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="firebase-config.js?v=202610121109" charset="utf-8"></script><script src="claude-shim.js?v=202610121109" charset="utf-8"></script><style>body{margin:0}.export-row .fld{display:none}</style></head><body><title>ตารางวางแผนการฝึก 7 วัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
/* Layout: เครื่องมือแบบบอร์ด — แถบภาษา/โหมด, ข้อมูลผู้ทำ, ฟอร์ม Microcycle (กรอบเส้นหนาแบบใบงาน), กล่องเครื่องมือ, ตาราง 7 วัน (จอแคบ = การ์ดรายวัน), ผลประเมิน; โหมดอาจารย์แทนที่ด้วยหน้ารวมคะแนน */
:root{
  /* Sandbox ธีมสว่างแบบสากล: การ์ดขาวล้วนบนพื้นเทาอ่อน แถบหัวขาวมีเส้นขอบ */
  --bg:#f6f7f5; --surface:#ffffff; --cell:#fafbf9; --ink:#1d2321; --muted:#5e6862; --line:#e2e5df;
  --accent:#8fcf3c; --accent-ink:#1d2a0c; --bar:#ffffff; --bar-ink:#1d2321; --bar-line:#e2e5df; --brand-g:#5d9a1c;
  --hi:#9a7cf2; --hi-ink:#2a1a63; --mid:#f2884b; --mid-ink:#5a2508; --lo:#5fd0de; --lo-ink:#08454d; --rest:#b4b8b5; --rest-ink:#2e3230;
  --good:#2f8a3e; --warn:#b7791f; --bad:#c2402f;
  /* ชิ้นงาน: สีกลุ่ม V ปริมาณ / I ความหนัก / R การพัก (ไม่ซ้ำสีเป้าหมายการฝึก) — เข้ม / พื้นอ่อน / ตัวอักษรบนพื้น / ตัวอักษรในสูตร */
  --vv:#1D9E75; --vv-bg:#E1F5EE; --vv-ink:#085041; --vv-t:#0F6E56;
  --vi:#D85A30; --vi-bg:#FAECE7; --vi-ink:#712B13; --vi-t:#993C1D;
  --vr:#7F77DD; --vr-bg:#EEEDFE; --vr-ink:#3C3489; --vr-t:#534AB7;
  --f-display:"Kanit","Noto Sans SC",system-ui,sans-serif; --f-body:"Sarabun","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2220; --cell:#232926; --ink:#e8ece6; --muted:#9aa49d; --line:#333b37;
  --accent:#9bd84a; --accent-ink:#14200a; --bar:#0b0e0d; --bar-ink:#e8ece6; --bar-line:#0b0e0d; --brand-g:#9bd84a;
  --hi:#8f74e6; --hi-ink:#f0ebff; --mid:#e57c40; --mid-ink:#fff1e8; --lo:#3fb5c4; --lo-ink:#e6fbfd; --rest:#6c726f; --rest-ink:#f2f4f3;
  --good:#5fc36e; --warn:#e0a84a; --bad:#ef6e5c; color-scheme:dark;
  --vv-bg:#085041; --vv-ink:#E1F5EE; --vv-t:#5DCAA5; --vi-bg:#712B13; --vi-ink:#FAECE7; --vi-t:#F0997B; --vr-bg:#3C3489; --vr-ink:#EEEDFE; --vr-t:#AFA9EC}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2220; --cell:#232926; --ink:#e8ece6; --muted:#9aa49d; --line:#333b37;
  --accent:#9bd84a; --accent-ink:#14200a; --bar:#0b0e0d; --bar-ink:#e8ece6; --bar-line:#0b0e0d; --brand-g:#9bd84a;
  --hi:#8f74e6; --hi-ink:#f0ebff; --mid:#e57c40; --mid-ink:#fff1e8; --lo:#3fb5c4; --lo-ink:#e6fbfd; --rest:#6c726f; --rest-ink:#f2f4f3;
  --good:#5fc36e; --warn:#e0a84a; --bad:#ef6e5c; color-scheme:dark;
  --vv-bg:#085041; --vv-ink:#E1F5EE; --vv-t:#5DCAA5; --vi-bg:#712B13; --vi-ink:#FAECE7; --vi-t:#F0997B; --vr-bg:#3C3489; --vr-ink:#EEEDFE; --vr-t:#AFA9EC}

*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--bar);color:var(--bar-ink);border:1px solid var(--bar-line);border-radius:6px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.top h1{font-size:1.6rem;letter-spacing:.01em;line-height:1.15}
.top h1 span{color:var(--brand-g)}
#thmSeg .tl{margin-left:4px}
@media (max-width:640px){#thmSeg .tl{display:none}}
.credit{font-size:.78rem;letter-spacing:.06em;color:color-mix(in srgb,var(--bar-ink) 70%,transparent)}
.switches{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--bar-ink) 35%,transparent);border-radius:5px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;border-radius:3px;padding:6px 12px;color:var(--bar-ink);font-family:var(--f-display);font-weight:500;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:4px;padding:8px 14px;font-family:var(--f-display);font-weight:500;background:var(--surface);color:var(--ink);border:1px solid var(--line);min-height:40px}
.top .btn{background:transparent;color:var(--bar-ink);border-color:color-mix(in srgb,var(--bar-ink) 30%,transparent)}
.btn.primary,.top .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:.88rem;min-height:34px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.who{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 200px}
.fld label,.lab{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld input,.fld select{border:1px solid var(--line);border-radius:4px;padding:7px 10px;background:var(--bg);min-width:0;width:100%}
.fld.wide{flex:2 1 320px}
.status{font-size:.85rem;color:var(--muted);flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.dot.live{background:var(--good)} .dot.off{background:var(--warn)}
.groups{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}
.gchip{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:4px 10px;font-size:.84rem;font-variant-numeric:tabular-nums}
.gchip b{font-family:var(--f-display);font-weight:600}
.gchip[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--bg))}

.fb{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;align-items:start;border-left:4px solid var(--accent)}
.fb h2{font-size:1.05rem;margin-bottom:4px}
.fb .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fb .big small{font-size:.9rem;color:var(--muted);font-weight:500}
.fb dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:.88rem}
.fb dt{color:var(--muted)} .fb dd{margin:0;font-variant-numeric:tabular-nums}
.fb blockquote{margin:8px 0 0;padding:8px 12px;background:var(--cell);border-radius:4px;white-space:pre-wrap}

/* microcycle form — echoes the paper worksheet: heavy ruled boxes */
.mc{background:var(--surface);border:2px solid var(--ink);border-radius:4px;display:flex;flex-direction:column}
.mc-title{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;font-size:1.35rem;padding:6px 12px;border-bottom:2px solid var(--ink)}
.mc-title small{display:block;font-size:.78rem;letter-spacing:.02em;text-transform:none;font-weight:500;color:var(--muted)}
.mc-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:2px solid var(--ink)}
.mc-row > *{padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mc-row > * + *{border-left:2px solid var(--ink)}
.mc-row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mc-row2 > .lv{border-right:2px solid var(--ink);padding:8px 12px;min-width:0}
.mc-side{display:flex;flex-direction:column;min-width:0}
.mc-side .cyc{padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink)}
.mc .fld{flex:none}
.mc .fld input,.mc .fld select{padding:5px 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sexseg{display:inline-flex;gap:4px}
.sexseg button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:4px 14px;font-family:var(--f-display);font-weight:500;min-height:36px}
.sexseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lv-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.lv-head h3{font-size:.95rem;letter-spacing:.12em;text-transform:uppercase}
.lv-scroll{overflow-x:auto}
.lvt{border-collapse:collapse;width:100%;min-width:320px}
.lvt th{text-align:left;font-family:var(--f-display);font-weight:600;font-size:.9rem;padding:3px 8px 3px 0;white-space:nowrap}
.lvt td{border-left:1px solid var(--line);padding:3px;text-align:center}
.lvt tr + tr th,.lvt tr + tr td{border-top:1px solid var(--line)}
.lvt thead td{font-size:.72rem;color:var(--muted);border-top:0}
.lvb{width:100%;min-width:34px;height:32px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
.lvb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.lvb.fill{background:color-mix(in srgb,var(--accent) 30%,var(--bg))}
.sigma{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex:1}
.sigma div{padding:8px 6px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.sigma div + div{border-left:2px solid var(--ink)}
.sigma span{font-family:var(--f-display);font-weight:700;font-size:.95rem}
.sigma strong{font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:820px){
  .mc-row{grid-template-columns:1fr}.mc-row > * + *{border-left:0;border-top:2px solid var(--ink)}
  .mc-row2{grid-template-columns:1fr}.mc-row2 > .lv{border-right:0;border-bottom:2px solid var(--ink)}
}

.tools{display:flex;flex-direction:column;gap:14px}
.tools-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.tools-head h2{font-size:1.1rem}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.tgroup{display:flex;flex-direction:column;gap:6px}
.tgroup h3{font-size:.92rem;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.tgroup h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem}
.catbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.catbar button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.84rem;min-height:34px;white-space:nowrap}
.catbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lib-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.card{flex:0 0 200px;scroll-snap-align:start;border-radius:5px;padding:10px 11px;background:var(--surface);color:var(--ink);font-size:.84rem;line-height:1.4;position:relative;user-select:none;-webkit-user-select:none;border:1.5px solid var(--line);text-align:left}
.card b{font-family:var(--f-display);font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
.card ul{margin:0;padding-left:16px}
.card .tag{display:inline-block;font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-bottom:4px}
.lib-list .card{cursor:grab;background:var(--bg)}
.pick.sel{outline:3px solid var(--ink);outline-offset:1px}
.card .x{position:absolute;top:4px;right:6px;background:none;border:0;color:inherit;opacity:.6;font-size:1.1rem;line-height:1;min-width:28px;min-height:28px}
.lib-list .card.mine{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.card.new{position:sticky;left:0;z-index:1;background:var(--surface);color:var(--muted);border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:.95rem;min-height:100px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;line-height:1.25;padding:4px 9px;border-radius:3px;font-weight:600;color:#1d2321;text-align:center;border:0}
.chips .chip{cursor:grab;min-height:32px}
.gset{display:flex;flex-direction:column;gap:4px}.gset + .gset{margin-top:6px}
.gset-h{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:.82rem}.gset-h b{font-family:var(--f-display);font-weight:600}.gset-h span{color:var(--muted);font-size:.76rem}
.loads{display:flex;flex-wrap:wrap;gap:8px}
.lpick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 12px 5px 6px;cursor:grab;font-family:var(--f-display);font-weight:500;min-height:40px}
.lpick i{display:block;width:22px;border-radius:2px;background:var(--c)}
[data-load="hi"]{--c:var(--hi);--ci:var(--hi-ink)} [data-load="mid"]{--c:var(--mid);--ci:var(--mid-ink)}
[data-load="lo"]{--c:var(--lo);--ci:var(--lo-ink)} [data-load="rest"]{--c:var(--rest);--ci:var(--rest-ink)}
.ref summary{cursor:pointer;font-size:.86rem;color:var(--muted)}
.ref table{border-collapse:collapse;font-size:.84rem;margin-top:6px;font-variant-numeric:tabular-nums}
.ref td{padding:2px 12px 2px 0;border-bottom:1px solid var(--line)}
.ref p{margin:6px 0 0;font-size:.82rem;color:var(--muted);max-width:65ch}
.armedbar{font-size:.86rem;background:color-mix(in srgb,var(--accent) 25%,var(--surface));border-radius:4px;padding:6px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.board-scroll{overflow-x:auto;border-radius:6px;border:1px solid var(--line);background:var(--surface);-webkit-overflow-scrolling:touch}
.board{display:grid;grid-template-columns:104px repeat(7,minmax(140px,1fr));min-width:1100px}
.board{position:relative}
.board.list{display:block;min-width:0}
.loadc[data-load]{touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;cursor:grab}
.loadc.lifting svg{opacity:.25}
.lghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;width:80px;opacity:.92;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3))}
.lghost svg{width:80px;height:auto;display:block}
.lghost text{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--ci)}
.slot .card{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.slot .card b{padding-right:26px;font-family:var(--f-body);font-weight:400;font-size:.76rem;line-height:1.35;color:var(--muted);margin-bottom:3px}
.slot .card.lifting{opacity:.3}
.grip{position:absolute;top:2px;right:2px;width:30px;height:30px;display:grid;place-items:center;touch-action:none;color:var(--muted);font-size:13px;letter-spacing:-3px;cursor:grab;border-radius:4px}
.grip:hover{background:var(--cell);color:var(--ink)}
.cghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;width:170px;opacity:.94;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:5px;padding:8px 10px;font-size:.78rem;line-height:1.35;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.cghost b{font-family:var(--f-display);font-weight:600;display:block}.cghost ul{margin:2px 0 0;padding-left:14px}.cghost .grip{display:none}
.goals .chip{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:grab}
.goals .chip.lifting{opacity:.3}
.goals .chip.ins-b{box-shadow:-3px -3px 0 0 var(--accent)!important}.goals .chip.ins-a{box-shadow:3px 3px 0 0 var(--accent)!important}
.gghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;opacity:.94}.gghost .chip{box-shadow:0 6px 14px rgba(0,0,0,.3)}
.lline{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
.lline polyline{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;opacity:.85}
.lline .o{fill:var(--ink)} .lline .i{fill:var(--surface)}
.lcurve{padding:4px 10px 0}.lcurve .lab{display:block;margin-bottom:2px}
.lcurve svg{width:100%;max-width:440px;display:block}
.lcurve polyline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.lcurve .gl{stroke:var(--line);stroke-width:1}
.lcurve text{font-size:10px;fill:var(--muted);text-anchor:middle;font-family:var(--f-body)}
.lcurve .pt{fill:var(--c);stroke:var(--ink);stroke-width:1}
.rowlab{font-family:var(--f-display);font-weight:600;font-size:.92rem;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-top:1px solid var(--line)}
.dayh{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:1.5rem;text-align:center;padding:6px 0;margin:8px 4px;border-radius:3px;line-height:1.2}
.dayh small{display:block;font-size:.72rem;font-weight:500;opacity:.8}
.cellc{border-top:1px solid var(--line);padding:6px 4px}
.drop{background:var(--cell);border-radius:4px;border:2px dashed transparent;transition:border-color .15s}
.drop.over,.armed-card .slot,.armed-goal .goals,.armed-load .loadc{border-color:color-mix(in srgb,var(--accent) 80%,var(--ink));cursor:copy}
.slot{min-height:170px;height:100%;padding:6px;display:flex;flex-direction:column}
.empty-msg{margin:auto;color:var(--muted);font-size:.78rem;text-align:center}
.slot .card{flex:1;width:100%;cursor:pointer;font-size:.8rem;background:var(--surface)}
.goals{display:flex;flex-direction:column;gap:3px;padding:6px;min-height:96px;height:100%}
.goals .chip{cursor:pointer;font-size:.72rem;padding:3px 6px}
.loadc{display:flex;align-items:flex-end;justify-content:center;height:92px;cursor:pointer}
.loadc svg{width:62px;height:88px;display:block}
.f-front{fill:var(--c)} .f-top{fill:var(--c);filter:brightness(1.2)} .f-side{fill:var(--c);filter:brightness(.78)}
.loadc text{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--ci);opacity:.8}
.arrow{display:flex;flex-direction:column;align-items:center;gap:6px}
.arrow svg{width:12px;height:42px}
.arrow path{fill:var(--ink)}
.vol{background:var(--cell);border-radius:4px;padding:4px;display:flex;flex-direction:column;gap:2px}
.vol label{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:4px;font-size:.75rem;font-weight:600;color:var(--muted)}
.vol input{width:100%;min-width:0;border:1px solid var(--line);border-radius:3px;padding:1px 4px;background:var(--surface);font-variant-numeric:tabular-nums;text-align:right}
/* phone portrait: one card per day */
.dlist{display:flex;flex-direction:column;gap:10px;padding:10px}
.dcard{border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:8px}
.dcard .dayh{margin:0;font-size:1.15rem;display:flex;gap:8px;justify-content:center;align-items:baseline}
.dcard .dayh small{display:inline;font-size:.85rem}
.dsec{display:flex;flex-direction:column;gap:4px}
.dsec.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.dsec.two > div{display:flex;flex-direction:column;gap:4px}
.dcard .slot{min-height:84px}
.dcard .goals{min-height:44px;flex-direction:row;flex-wrap:wrap}
.dcard .loadc{height:84px}
.dcard .loadc svg{width:58px;height:80px}
.rotate{padding:10px 10px 0}

.sum{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.9rem;color:var(--muted)}
.sum strong{color:var(--ink);font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:600}

.eval{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px 24px;align-items:start}
.score{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1rem;color:var(--muted);font-weight:500}
.grade{font-family:var(--f-display);font-size:.95rem;margin-top:4px}
.eval ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.eval li{padding-left:22px;position:relative}
.eval li::before{position:absolute;left:0;top:0;font-weight:700}
.eval li.ok::before{content:"✓";color:var(--good)}
.eval li.warn::before{content:"!";color:var(--warn);left:5px}
.eval li.bad::before{content:"✕";color:var(--bad)}
.eval h2{font-size:1.1rem;margin-bottom:8px}
.eval h3{font-size:.95rem;margin:12px 0 6px}

/* teacher */
.teacher{display:flex;flex-direction:column;gap:14px}
.t-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.t-head h2{font-size:1.3rem}
.t-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.t-tools select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface);min-height:36px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:5px;padding:3px;gap:3px;background:var(--surface)}
.tabs button{border:0;background:transparent;border-radius:3px;padding:6px 14px;font-family:var(--f-display);font-weight:500;min-height:36px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.stat span{display:block;font-size:.8rem;color:var(--muted)}
.stat strong{font-family:var(--f-display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums}
.export{display:flex;flex-direction:column;gap:8px}
.export h3{font-size:1rem}
.export-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.export-row .fld{flex:1 1 280px}
#sheetStatus{font-size:.88rem}
#sheetStatus a{font-weight:600}
.grow{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.grow-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.grow h3{font-size:1.05rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.grow h3 code{font-family:var(--f-display);background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:3px;font-size:.9rem}
.gmeta{font-size:.85rem;color:var(--muted)}
.prog{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin-top:4px}
.prog span{display:inline-flex;align-items:center;gap:6px}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--cell);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.scores{display:flex;gap:14px;justify-content:flex-end;text-align:right}
.scores div span{display:block;font-size:.72rem;color:var(--muted)}
.scores strong{font-family:var(--f-display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--cell);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.grow-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:6px}
.mini-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mini{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;min-width:800px}
.mcol{background:var(--cell);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:5px;font-size:.78rem}
.mcol .dh{font-family:var(--f-display);font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:3px;text-align:center;padding:1px 0}
.mcol b{font-family:var(--f-display);font-weight:600}
.mcol ul{margin:0;padding-left:14px}
.mcol .chip{font-size:.68rem;padding:1px 5px}
.mcol .mv{color:var(--muted);font-variant-numeric:tabular-nums}
.mload{border-radius:3px;padding:2px 6px;font-family:var(--f-display);font-weight:600;text-align:center;background:var(--c);color:var(--ci)}
.mload.none,.mcol .none{background:transparent;color:var(--muted);font-family:var(--f-body);font-weight:400}
.pinfo{font-size:.84rem;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)}
.pinfo b{color:var(--ink);font-weight:600}
.grow .eval{border:0;padding:0}
.rub{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.rub h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:.95rem}
.rub-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.88rem}
.rub-opts{display:flex;gap:4px}
.rub-opts button{width:38px;height:36px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-variant-numeric:tabular-nums}
.rub-opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rub textarea{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--bg);min-height:70px;resize:vertical;width:100%}
.rub-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:.86rem;color:var(--muted)}

.foot{text-align:center;font-size:.82rem;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.foot strong{color:var(--ink);font-family:var(--f-display);font-weight:600}

.modal{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--surface);color:var(--ink);border-radius:8px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog h3{font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:.88rem}
.field input,.field textarea{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--bg)}
.field textarea{min-height:140px;resize:vertical}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dlg-actions .danger{margin-right:auto}
.toast{display:flex;align-items:center;gap:12px;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:8px 16px;border-radius:4px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}

/* tablet & phone */
@media (max-width:760px){
  input,select,textarea{font-size:16px} /* iOS: no auto-zoom on focus */
  .top{padding:12px 14px}.top h1{font-size:1.35rem}
  .actions{width:100%}.actions .btn{flex:1 1 auto}
  .eval,.fb{grid-template-columns:1fr}
  .armedbar{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;box-shadow:0 4px 16px color-mix(in srgb,#000 25%,transparent);background:var(--surface);border:2px solid var(--accent)}
  .rub-row{grid-template-columns:1fr}.grow-top{grid-template-columns:1fr}.scores{justify-content:flex-start;text-align:left}
  .board-scroll.list{overflow-x:auto;overflow-y:visible}
}
.tbtn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:3px 10px;font-family:var(--f-display);font-weight:500;min-height:30px;white-space:nowrap}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:5px;padding:3px;gap:3px;background:var(--surface)}
.seg2 button{border:0;background:transparent;border-radius:3px;padding:6px 12px;font-family:var(--f-display);font-weight:500;min-height:36px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wov{padding:10px 10px 0;display:flex;flex-direction:column;gap:6px}
.wov-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wov-d{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:4px 2px;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0}
.wov-d b{font-family:var(--f-display);font-size:.95rem;line-height:1}
.wov-d .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:7px}
.wov-d .dots i{display:block;width:7px;height:7px;border-radius:50%}
.wov-d .nm{font-size:.62rem;line-height:1.2;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word;min-height:2.4em;color:var(--muted)}
.wov-d .lb{font-size:.62rem;width:100%;text-align:center;border-radius:2px;background:var(--c,var(--cell));color:var(--ci,var(--muted));padding:1px 0;font-weight:600}
.modal.sheet{place-items:end center;padding:0}
.modal.sheet .dialog{width:100%;max-width:720px;border-radius:12px 12px 0 0;max-height:82vh;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.dialog .chip.pk{min-height:38px;font-size:.84rem;outline-offset:1px}.dialog .chip.pk.on{outline:3px solid var(--ink)}
.lpk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lpk button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:96px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px}
.lpk button i{display:block;width:34px;border-radius:2px;background:var(--c)}.lpk button b{font-family:var(--f-display);font-weight:600}
.lpk button[aria-pressed="true"]{outline:3px solid var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:.78rem;line-height:1.35;color:var(--ink);min-height:70px}
.pcard b{font-family:var(--f-display);font-weight:600;font-size:.88rem}.pcard span{color:var(--muted)}
.pcard.mine{border:2px solid var(--accent)}.pcard.new{border:2px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;font-family:var(--f-display)}
@media (max-width:760px){.wrap{padding-block:16px 120px}}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.gtabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.84rem;min-height:36px;white-space:nowrap}
.gtabs button i{display:block;width:12px;height:12px;border-radius:50%}
.gtabs button b{font-family:var(--f-display);font-size:.75rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.gtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card .tag.warn,.tag.warn{color:#fff;background:#d32f2f;border-color:#d32f2f;margin-left:4px}
.pnfnote{margin:6px 0 0;font-size:.82rem;color:var(--bad);font-weight:600}
.wsum{padding:10px;display:flex;flex-direction:column;gap:6px}
.wsum .lcurve{padding:0}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) 62px;gap:6px;align-items:stretch;border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--surface)}
.wday{background:var(--accent);color:var(--accent-ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);line-height:1.1}
.wday b{font-size:1.25rem}.wday small{font-size:.62rem;font-weight:500;text-align:center}
.wmain{display:flex;flex-direction:column;gap:4px;min-width:0}
.wsum .goals.wg{min-height:30px;height:auto;flex-direction:row;flex-wrap:wrap;padding:4px;gap:3px}
.wsum .goals.wg .chip{font-size:.68rem;padding:2px 6px}
.wsum .slot.ws{min-height:30px;height:auto;padding:5px 7px;display:block;font-size:.78rem;line-height:1.3;cursor:pointer}
.wsum .slot.ws b{font-family:var(--f-body);font-weight:400;font-size:.74rem;color:var(--muted);display:block}
.wsum .slot.ws span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wsum .empty-msg{margin:0;font-size:.74rem}
.wvol{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wvol button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 8px;font-size:.72rem;min-height:28px;white-space:nowrap}
.wsum .loadc.wl{height:auto;min-height:64px;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding:4px}
.wsum .loadc.wl i{display:block;width:34px;border-radius:2px;background:var(--c)}
.wsum .loadc.wl span{font-family:var(--f-display);font-weight:600;font-size:.74rem}
.wsum .loadc.wl .empty-msg{margin:auto;font-weight:400;font-family:var(--f-body)}
.lghost i{display:block;width:34px;height:30px;border-radius:2px;background:var(--c);margin:0 auto}.lghost span{display:block;text-align:center;font-weight:600}
#boardWrap{touch-action:pan-x pan-y}
.zoomc{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.zoomc button{border:1px solid var(--line);background:var(--surface);border-radius:4px;min-width:36px;min-height:36px;padding:0 10px;font-family:var(--f-display);font-weight:600;font-size:1rem}
.zoomc button[data-z="fit"]{font-size:.84rem;font-weight:500}
.zoomc span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:.84rem}
.wsum{gap:4px}.wrow{padding:4px;gap:5px}.wsum .lcurve svg{max-height:70px}
.forl{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:5px;padding:3px 5px;border:1px dashed var(--line);border-radius:4px;background:transparent;font-size:.7rem;color:var(--muted);text-align:left;width:100%;cursor:pointer}
.forl.dev{border-style:solid;background:var(--cell);cursor:default}
.forl em{font-style:normal;color:var(--accent)}
.mchip{font-style:normal;font-size:.64rem;font-weight:600;border-radius:3px;padding:1px 5px;line-height:1.3}
.slot .card{padding-top:13px;overflow:hidden}
.gband{position:absolute;left:0;right:0;top:0;height:5px;display:flex}
.gband i{flex:1;display:block}
.gband.empty{background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.wsum .slot.ws,.mpc{position:relative;padding-top:10px}.mpc{display:block}
.imk{display:inline-flex;flex-direction:column;flex:none;width:9px;height:15px;border-radius:3px;overflow:hidden;border:0;padding:0;margin:2px 6px 0 0;vertical-align:-2px;cursor:pointer;background:transparent}
.imk i{flex:1;display:block}
.imk.empty{border:1.5px dashed var(--muted)}
span.imk{cursor:default}
.card ul.mk,.ws ul.mk,.mpc ul.mk{list-style:none;padding-left:0}
.card ul.mk li,.ws ul.mk li,.mpc ul.mk li{display:flex;align-items:flex-start}
.wsum .slot.ws ul{margin:3px 0 0;font-size:.72rem;color:var(--muted);padding-left:14px}
.cap{display:block;font-size:.7rem;letter-spacing:.02em;color:var(--muted);margin-bottom:2px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 2px;vertical-align:0}
.fwhat{margin:0;font-weight:600;font-size:.9rem}
.frows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.frow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;background:var(--surface);text-align:left;min-height:46px}
.frow+.frow{border-top:1px solid var(--line)}
.fdot{width:14px;height:14px;border-radius:50%;flex:none}
.fname{flex:1}
.fck{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;flex:none}
.frow[aria-pressed="true"] .fck{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mpc b{font-family:var(--f-body);font-weight:400;font-size:.74rem;color:var(--muted)}
.rowlab{flex-direction:column;gap:2px}
.rowlab small{display:block;font-family:var(--f-body);font-size:.66rem;font-weight:400;color:var(--muted)}
.sess{position:relative;display:flex;flex-direction:column;gap:4px;border-radius:5px;padding:4px;min-height:96px;box-sizing:border-box}
.cellc .sess{height:100%}
.sess .slab{font-size:.64rem;font-weight:700;letter-spacing:.06em;color:var(--muted);line-height:1.2}
.sess .goals.sg{min-height:30px;height:auto;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:4px}
.sess .goals.sg .chip{font-size:.68rem;padding:2px 6px}
.sess .slot.ss{min-height:0;height:auto;flex:1;padding:4px;display:flex;flex-direction:column;gap:4px}
.slot .card.sesscard{flex:none;width:100%;padding:11px 6px 4px;cursor:default;border:1.5px solid var(--line);border-radius:5px;background:var(--surface)}
.blk{position:relative;padding:3px 18px 3px 0;cursor:pointer;border-radius:3px;font-size:.74rem;line-height:1.35}
.blk{background:var(--surface);border:1.5px dashed var(--line);border-radius:5px;padding:6px 20px 6px 6px}
.blk+.blk{margin-top:2px}
.blk.framed{border-style:solid;padding:6px 20px 6px 6px}
.imk.blkc{width:12px;height:12px;border-radius:3px;flex-direction:row;margin:0 6px 0 0;vertical-align:-1px}
.blk:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.blk.lifting{opacity:.3}
.blk .grip{top:0;right:-2px;width:24px;height:24px}
.blk ul{margin:0;padding-left:13px}
.blk ul.mk{padding-left:0}
.addblk{border:1px dashed var(--line);background:transparent;border-radius:4px;font-size:.7rem;color:var(--muted);padding:3px 6px;width:100%;cursor:pointer;min-height:28px}
.addblk:hover{color:var(--ink);border-color:var(--muted)}
.sess.over{outline:2px dashed var(--accent);outline-offset:-2px}
.sess.rest{background:linear-gradient(to bottom right,transparent calc(50% - 1px),color-mix(in srgb,var(--muted) 65%,transparent) calc(50% - 1px),color-mix(in srgb,var(--muted) 65%,transparent) calc(50% + 1px),transparent calc(50% + 1px)),var(--cell)}
.sess.rest .drop{background:transparent}
.sess.rest .addblk{border-color:transparent;background:color-mix(in srgb,var(--surface) 75%,transparent);margin-top:auto}
.sess .restlab{position:absolute;top:3px;right:8px;font-family:var(--f-display);font-weight:600;font-size:.82rem;line-height:1.2;color:var(--muted);pointer-events:none}
.sess.rest{min-height:46px}.sess.rest .goals.sg{min-height:0;padding:0}.sess.rest .slot.ss{padding:0 2px 2px;flex:none;margin-top:auto}.sess.rest .addblk{min-height:24px;padding:1px 6px;font-size:.66rem}
.wsum .wmain .sess{min-height:46px}
.dsess{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:480px){.dsess{grid-template-columns:1fr 1fr}}
.wsum .wmain{gap:4px}

let writing=false,pending=false,debounceT=null;
function commit(opts={}){
  if(local.mode==='group'){
    if(!group.plan)return;
    if(db){clearTimeout(debounceT);debounceT=setTimeout(pushGroup,opts.slow?600:0)}
    else{local.groupLocal[group.code]=group.plan;saveLocal()}
  } else saveLocal();
  if(!opts.noRender){renderBoard();renderLib();if(!document.getElementById('eval').hidden)renderEval()}
  else{renderSum();renderSigma()}
  if(local.mode==='indiv')renderSubmitStatus();
}
async function pushGroup(){
  if(!db||!group.code||!group.plan)return;
  if(writing){pending=true;return}
  writing=true;setSync('saving');
  try{await db.doc('groups/'+group.code).set({...clone(group.plan),updatedAt:Date.now()});setSync('live')}
  catch(e){setSync(e&&e.code==='invalid_argument'?'denied':'error')}
  writing=false;if(pending){pending=false;pushGroup()}
}
function setSync(s){syncState=s;const el=document.getElementById('syncTxt');if(el)el.innerHTML=syncLabel()}
function syncLabel(){
  const m={live:['live','syncLive'],saving:['live','syncSaving'],error:['off','syncError'],denied:['off','syncDenied'],off:['off','syncOff']}[syncState];
  return `<span class="dot ${m[0]}"></span>${t(m[1])}`;
}
function groupFromDoc(d){return{name:d.name||'',members:d.members||'',context:d.context||'',custom:d.custom||[],days:normDays(d.days),profile:normProfile(d.profile)}}
function joinGroup(code){
  code=code.trim().toUpperCase();
  if(!/^[A-Z0-9][A-Z0-9_-]{0,39}$/.test(code)){toast(t('codeBad'));return}
  if(unsubGroup){unsubGroup();unsubGroup=null}
  if(unsubGGrade){unsubGGrade();unsubGGrade=null}
  group={code,plan:null};groupGrade=null;local.groupCode=code;saveLocal();
  if(db){
    setSync('saving');let first=true;
    unsubGroup=db.doc('groups/'+code).onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){group.plan=groupFromDoc(snap.data());setSync('live')}
      else if(first){group.plan={name:'',members:'',context:'',custom:[],days:emptyDays(),profile:normProfile()};pushGroup()}
      first=false;renderAll();
    },()=>setSync('error'));
    unsubGGrade=db.doc('ggrades/'+code).onSnapshot(s=>{groupGrade=s.exists?s.data():null;renderFeedback()},()=>{});
  } else {
    const g=local.groupLocal[code];
    group.plan=g?{...g,days:normDays(g.days),profile:normProfile(g.profile)}:{name:'',members:'',context:'',custom:[],days:emptyDays(),profile:normProfile()};
    syncState='off';
  }
  renderAll();
}
function leaveGroup(){if(unsubGroup){unsubGroup();unsubGroup=null}if(unsubGGrade){unsubGGrade();unsubGGrade=null}group={code:'',plan:null};groupGrade=null;local.groupCode='';saveLocal();renderAll()}

function keepTyping(fn){
  const a=document.activeElement,id=a&&a.id,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
  const val=typing?a.value:null;let s=null;try{s=a.selectionStart}catch(e){}
  fn();
  if(id){const n=document.getElementById(id);if(n&&n!==a){if(typing)n.value=val;n.focus({preventScroll:true});try{if(s!=null)n.setSelectionRange(s,s)}catch(e){}}}
}

function bindPicks(root){

/* ===== มื้อฝึก (Training session): ทุกวันมีมื้อเช้า (AM) และมื้อบ่าย (PM)
   มื้อที่ไม่มีเป้าหมายและเนื้อหา = พัก (ขีดเส้นทแยงจากล่างซ้ายไปบนขวา)
   แต่ละมื้อมีป้ายเป้าหมายของตัวเอง (เรียงลำดับได้) และการ์ดเนื้อหาได้หลายบล็อก แต่ละบล็อกมีสีตามเป้าหมาย
   Load และปริมาณ (kg/m/km/min/ครั้ง) นับรวมทั้งวัน ===== */
const SESS=['am','pm'];
const isRestS=S=>!S.goals.length&&!S.blocks.length;
const dayGoals=d=>[...new Set(SESS.flatMap(s=>d[s].goals))];
const dayBlocks=d=>SESS.flatMap(s=>d[s].blocks);
const hasTraining=d=>dayBlocks(d).length>0;
const sLab=(i,s)=>`${i+1} (${t(s)})`;
const blkName=b=>{const c=dispC(b);return c.name||c.items[0]||''};
const isSingle=c=>{const b=c&&BASE[c.ref];return !!(b&&!b.tx)};
const unitCount=c=>!c?0:isSingle(c)?1:dispC(c).items.length;
const unitTags=(S,bi,k)=>(((S.blocks[bi]&&S.blocks[bi].itemFor)||[])[k]||[]).filter(g=>S.goals.includes(g));
const blockTags=(S,bi)=>{const u=new Set();for(let k=0;k<unitCount(S.blocks[bi]);k++)unitTags(S,bi,k).forEach(g=>u.add(g));return S.goals.filter(g=>u.has(g))};
const forEff=S=>{const u=new Set();S.blocks.forEach((_,bi)=>blockTags(S,bi).forEach(g=>u.add(g)));return S.goals.filter(g=>u.has(g))};
const gband=S=>`<span class="gband${S.goals.length?'':' empty'}" aria-hidden="true">${S.goals.map(g=>`<i style="background:${GOAL_C[g][0]}"></i>`).join('')}</span>`;
function blockBody(S,i,s,bi,interactive){
  const blk=S.blocks[bi],c=dispC(blk),single=isSingle(blk);
  // ปุ่มสีของทั้งบล็อก (บนหัวกรอบเท่านั้น ไม่มีสีรายบรรทัด): แตะเพื่อเลือกว่าเนื้อหานี้ฝึกเป้าหมาย (สี) ใดของมื้อ — ใช้ได้ทั้งมือใหม่และชำนาญ
  const tg=blockTags(S,bi),bk=interactive?`<button type="button" class="imk blkc${tg.length?'':' empty'}" data-imk="${i}:${s}:${bi}:all" title="${esc(tg.length?tg.map(gT).join(', '):t('blkT'))}" aria-label="${esc(tg.length?tg.map(gT).join(', '):t('blkT'))}">${tg.map(g=>`<i style="background:${GOAL_C[g][0]}"></i>`).join('')}</button>`:'';
  if(single)return `<b>${bk}${esc(c.name)}</b><ul>${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<b>${bk}${c.name?esc(c.name):`<span class="nm0">${esc(c.items[0]||'')}</span>`}</b><ul>${c.items.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul>`;
}
/* งานทั่วไป (G) / งานเฉพาะกีฬา (S): ค่าเริ่มต้นจากหมวดการ์ด WA (ทั่วไป = G, หมวดประเภทกีฬา = S), การ์ดอื่นยังไม่ระบุ — แตะวงกลมเพื่อสลับ */
const defGS=ref=>{const b=BASE[ref];return !b?'':b.cat==='gen'?'G':['spr','jmp','thr','dist'].includes(b.cat)?'S':''};
const blkGS=b=>b.gs!==undefined&&b.gs!==null?b.gs:defGS(b.ref);
const PREP_G=['co_bal','co_gen','fx_dyn','fx_mob','fx_act'];
function gsBtn(blk,i,s,bi,interactive){const v=blkGS(blk),cls='gsb'+(v?' '+v.toLowerCase():'');
  return interactive?`<button type="button" class="${cls}" data-gs="${i}:${s}:${bi}" title="${esc(t('gsT'))}" aria-label="${esc(t('gsT'))}">${v||'G/S'}</button>`:(v?`<span class="${cls}">${v}</span>`:'')}
/* กรอบสีของบล็อก = สีสมรรถภาพที่บล็อกนี้ฝึก (ไม่ต้องมีข้อความ) — ชำนาญ: สีที่นักศึกษาเลือก, มือใหม่: สีที่ระบบแนะนำจากการ์ด WA */
function blkFrame(S,bi){
  const blk=S.blocks[bi],b=BASE[blk.ref],tg=blockTags(S,bi),cs=(tg.length?tg:(local.level==='new'&&b?b.eg:[])).map(g=>GOAL_C[g][0]);
  if(!cs.length)return '';
  if(cs.length===1)return `border:2px solid ${cs[0]}`;
  const st=cs.map((c,k)=>`${c} ${(k*100/cs.length).toFixed(1)}% ${((k+1)*100/cs.length).toFixed(1)}%`).join(',');
  return `border:2px solid transparent;border-image:linear-gradient(to bottom,${st}) 1`;
}
/* ช่องมื้อฝึก: ป้ายเป้าหมายด้านบน การ์ดเนื้อหา (หลายบล็อก) ด้านล่าง */

  const blocks=S.blocks.map((blk,bi)=>`<div class="blk${blkFrame(S,bi)?' framed':''}" style="${blkFrame(S,bi)}" data-blk="${i}:${s}:${bi}" title="${esc((()=>{const c=dispC(blk);return [c.name,...c.items].filter(Boolean).join('\n')})())}"${interactive?` tabindex="0" role="button" aria-label="${esc(t('editAria',i+1))}"`:''}>${gsBtn(blk,i,s,bi,interactive)}${interactive?`<span class="grip" title="${esc(t('gripT'))}" aria-hidden="true">⋮⋮</span>`:''}${blockBody(S,i,s,bi,interactive)}</div>`).join('');

}

/* ย้าย/เรียงด้วย Pointer Events (เมาส์ + นิ้ว iOS/Android)
   - Load: เมาส์ลากได้ทันที, นิ้วต้องกดค้าง ~0.3 วิ — ย้าย/สลับข้ามวัน
   - บล็อกเนื้อหา: เมาส์ลากทั้งบล็อก, นิ้วลากที่ ⋮⋮ — ย้ายหรือเรียงลำดับข้ามวัน/มื้อ (ป้ายเป้าหมายของมื้ออยู่ที่เดิม)
   - ป้ายเป้าหมาย: เรียงลำดับภายในมื้อเดียวกัน */
let lastTap={},dragEndAt=0,undo=null;
function dblTap(key){const now=Date.now();if(lastTap.k===key&&now-lastTap.t<450){lastTap={};return true}lastTap={k:key,t:now};return false}
function snap(){const p=cur();if(p)undo={mode:local.mode,code:group.code,days:clone(p.days)}}
function doUndo(){const p=cur();if(!undo||!p||undo.mode!==local.mode||undo.code!==group.code)return;p.days=normDays(undo.days);undo=null;commit();toast(t('undone'))}
function bindDrags(b){
  b.querySelectorAll('.loadc[data-load]').forEach(c=>{c.addEventListener('contextmenu',e=>e.preventDefault());attachDrag(c,'load')});
  b.querySelectorAll('.blk[tabindex]').forEach(c=>{const g=c.querySelector('.grip');if(g)g.addEventListener('contextmenu',e=>e.preventDefault());attachDrag(c,'block')});
  b.querySelectorAll('.goals .chip[data-rmgoal]').forEach(c=>{c.addEventListener('contextmenu',e=>e.preventDefault());attachDrag(c,'goal')});
}
function attachDrag(src,kind){
  src.addEventListener('pointerdown',e=>{
    if(touchCount>1)return;
    if((e.button&&e.button!==0)||selected)return;
    if(e.target.closest&&e.target.closest('[data-imk],[data-gs]'))return;
    const mouse=e.pointerType==='mouse',onGrip=!!(e.target.closest&&e.target.closest('.grip'));
    if(kind==='block'&&!mouse&&!onGrip)return;
    const immediate=mouse||onGrip,sx=e.clientX,sy=e.clientY;let drag=null,last=e;
    const timer=immediate?null:setTimeout(()=>{drag=startDrag(src,kind,last)},320);
    const off=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)};
    const move=ev=>{last=ev;
      if(!drag){const dist=Math.hypot(ev.clientX-sx,ev.clientY-sy);
        if(immediate){if(dist>5)drag=startDrag(src,kind,ev)}else if(dist>8){clearTimeout(timer);off()}
        if(!drag)return}
      ev.preventDefault();moveDrag(drag,ev)};
    const up=()=>{clearTimeout(timer);off();if(drag)dropDrag(drag)};
    const cancel=()=>{clearTimeout(timer);off();if(drag)endDrag(drag)};
    window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);
  });

function startDrag(src,kind,e){
  const g=document.createElement('div');
  if(kind==='load'){g.className='lghost';g.dataset.load=src.dataset.load}else g.className=kind==='goal'?'gghost':'cghost';
  g.innerHTML=kind==='goal'?src.outerHTML:src.innerHTML;document.body.appendChild(g);
  src.classList.add('lifting');try{navigator.vibrate&&navigator.vibrate(12)}catch(err){}
  let f=null,from;
  if(kind==='goal'){const c=src.closest('.goals[data-day]');f={i:+c.dataset.day,s:c.dataset.sess||'am'};from=f.i}
  else if(kind==='block'){const [a,s,bi]=src.dataset.blk.split(':');f={i:+a,s,bi:+bi};from=f.i}
  else from=+src.dataset.day;
  const d={src,kind,from,f,g:src.dataset.rmgoal,ghost:g,target:null,to:null,mark:null};moveDrag(d,e);return d;
}
function edgeScroll(x,y){
  if(y<70)window.scrollBy(0,-14);else if(y>window.innerHeight-70)window.scrollBy(0,14);
  const w=document.getElementById('boardWrap'),wr=w.getBoundingClientRect();
  if(x<wr.left+40)w.scrollLeft-=14;else if(x>wr.right-40)w.scrollLeft+=14;
}
function moveDrag(d,e){
  const x=e.clientX,y=e.clientY,el=document.elementFromPoint(x,y);
  if(d.kind==='goal'){ // เรียงลำดับภายในมื้อเดียวกัน
    d.ghost.style.transform=`translate(${x-40}px,${y-16}px)`;
    const cell=el&&el.closest?el.closest('.goals[data-day]'):null,ch=el&&el.closest?el.closest('.goals .chip[data-rmgoal]'):null;
    if(d.mark)d.mark.classList.remove('ins-b','ins-a');d.mark=null;d.to=null;
    if(cell&&+cell.dataset.day===d.f.i&&(cell.dataset.sess||'am')===d.f.s){
      if(ch&&ch!==d.src){const r=ch.getBoundingClientRect(),col=getComputedStyle(cell).flexDirection.startsWith('column');
        const before=col?y<r.top+r.height/2:(y<r.top?true:y>r.bottom?false:x<r.left+r.width/2);
        d.to={g:ch.dataset.rmgoal,before};d.mark=ch;ch.classList.add(before?'ins-b':'ins-a')}
      else if(!ch)d.to={end:true};
    }
    edgeScroll(x,y);return;
  }
  if(d.kind==='block'){ // ย้าย/เรียงบล็อกไปมื้อใดก็ได้
    d.ghost.style.transform=`translate(${x-85}px,${y-18}px)`;
    const sc=el&&el.closest?el.closest('.sess[data-day]'):null;
    if(d.target&&d.target!==sc)d.target.classList.remove('over');d.target=sc;d.to=null;
    if(sc){sc.classList.add('over');const bl=[...sc.querySelectorAll('.blk')];let idx=bl.length;
      for(let k=0;k<bl.length;k++){const r=bl[k].getBoundingClientRect();if(y<r.top+r.height/2){idx=k;break}}
      d.to={i:+sc.dataset.day,s:sc.dataset.sess,idx}}
    edgeScroll(x,y);return;
  }
  d.ghost.style.transform=`translate(${x-40}px,${y-70}px)`;
  const cell=el&&el.closest?el.closest('[data-day]'):null;
  const to=cell?+cell.dataset.day:null,tc=to!=null&&to!==d.from?document.querySelector(`#board .loadc[data-day="${to}"]`):null;
  if(d.target&&d.target!==tc)d.target.classList.remove('over');
  d.target=tc;d.to=tc?to:null;if(tc)tc.classList.add('over');
  edgeScroll(x,y);
}
function endDrag(d){d.ghost.remove();d.src.classList.remove('lifting');if(d.target)d.target.classList.remove('over');if(d.mark)d.mark.classList.remove('ins-b','ins-a');dragEndAt=Date.now()}
function dropDrag(d){
  const to=d.to;endDrag(d);const p=cur();if(!p||to==null)return;
  if(d.kind==='goal'){const S=p.days[d.f.i][d.f.s],arr=S.goals.filter(g=>g!==d.g);
    if(to.end)arr.push(d.g);else{const k=arr.indexOf(to.g);if(k<0)return;arr.splice(to.before?k:k+1,0,d.g)}
    if(arr.join()===S.goals.join())return;snap();S.goals=arr;commit();toastUndo(t('goalReordered'));return}
  if(d.kind==='block'){const A=p.days[d.f.i][d.f.s].blocks,B=p.days[to.i][to.s].blocks;let idx=to.idx;
    if(A===B&&(idx===d.f.bi||idx===d.f.bi+1))return;

  if(to===d.from)return;
  snap();const ds=p.days,msg=ds[to].load?'loadSwapped':'loadMoved';[ds[d.from].load,ds[to].load]=[ds[to].load,ds[d.from].load];
  commit();toastUndo(t(msg));
}
/* กราฟเส้นเชื่อมยอดกล่อง Load (มุมมองตาราง) — วัดตำแหน่งจริงของกล่องแล้ววาด SVG ทับ */
function drawLoadLine(){
  const b=document.getElementById('board');b.querySelectorAll('svg.lline').forEach(n=>n.remove());
  if(b.classList.contains('list')||local.mode==='teacher')return;
  const br=b.getBoundingClientRect(),pts=Array(7).fill(null);
  b.querySelectorAll('.loadc[data-day]').forEach(c=>{const m=c.querySelector('.ltop');if(!m)return;const r=m.getBoundingClientRect();if(!r.width&&!r.height&&!r.left)return;pts[+c.dataset.day]=[(r.left+r.width/2-br.left)/zoom,(r.top+r.height/2-br.top)/zoom]});
  if(!pts.some(Boolean))return;
  const runs=[];let run=[];pts.forEach(p=>{if(p)run.push(p);else{if(run.length)runs.push(run);run=[]}});if(run.length)runs.push(run);
  const f=v=>v.toFixed(1);
  b.insertAdjacentHTML('beforeend',`<svg class="lline" width="${b.scrollWidth}" height="${b.scrollHeight}" aria-hidden="true">${runs.filter(r=>r.length>1).map(r=>`<polyline points="${r.map(p=>f(p[0])+','+f(p[1])).join(' ')}"/>`).join('')}${pts.filter(Boolean).map(p=>`<circle class="o" cx="${f(p[0])}" cy="${f(p[1])}" r="5"/><circle class="i" cx="${f(p[0])}" cy="${f(p[1])}" r="2"/>`).join('')}</svg>`);
}

/* ซูมเข้า/ออกทั้งตาราง: ปุ่ม − / + / พอดีจอ และใช้สองนิ้วถ่างหรือบีบบนตารางได้ (แนวตั้งและแนวนอน) */
// ซูมต่ำสุด 60% เพื่อให้ตัวอักษรไทยยังอ่านได้ (เล็กกว่านี้ให้สลับเป็นโหมดกระชับแทน)
const ZMIN=0.6,ZMAX=1.6;
let zoom=Math.min(ZMAX,Math.max(ZMIN,+local.zoom||1)),touchCount=0;
function applyZoom(z,save){
  zoom=Math.min(ZMAX,Math.max(ZMIN,Math.round(z*100)/100));
  const b=document.getElementById('board');b.style.zoom=zoom===1?'':String(zoom);
  const o=document.getElementById('zoomVal');if(o)o.textContent=Math.round(zoom*100)+'%';
  if(save){local.zoom=zoom;saveLocal()}
  if(typeof queueLine==='function')queueLine();
}
function fitZoom(){
  const b=document.getElementById('board'),vb=document.getElementById('viewBar');
  // พื้นที่สูงที่มองเห็นได้จริง = จอ − แถบขั้นตอน (ติดบน) − แถบมุมมอง − แถบสรุป (ติดล่าง)
  const st=document.getElementById('steps'),sm=document.getElementById('sum'),stH=st&&!st.hidden&&getComputedStyle(st).position==='sticky'?st.offsetHeight:0;
  // ความกว้างที่ตารางต้องการจริง = min-width ของตาราง (ตารางยืดเต็มพื้นที่เองเมื่อซูม) — ไม่ใช้ scrollWidth ที่เปลี่ยนตามระดับซูม
  const natW=parseFloat(getComputedStyle(b).minWidth)||b.scrollWidth,availH=window.innerHeight-stH-(vb.offsetHeight||0)-(sm&&!sm.hidden?sm.offsetHeight:0)-28,availW=document.getElementById('boardWrap').clientWidth;
  // ความสูงของตารางเปลี่ยนตามซูม (ข้อความตัดบรรทัดต่างกัน) จึงคำนวณซ้ำจนนิ่ง แล้วตรวจว่าพอดีจริง
  let prev=-1;
  for(let k=0;k<6;k++){const nz=Math.min(1,availH/(b.getBoundingClientRect().height/zoom),availW/natW);applyZoom(Math.max(nz,ZMIN),false);if(Math.abs(nz-prev)<0.01)break;prev=nz}
  while(zoom>ZMIN&&b.getBoundingClientRect().height>availH)applyZoom(zoom-0.02,false);
  applyZoom(zoom,true);
  if(b.getBoundingClientRect().height>availH+1)toast(t(local.density==='full'?'fitHintFull':'fitHintMin'),6000);
  window.scrollTo({top:vb.getBoundingClientRect().top+window.scrollY-stH-6});
}
(function bindPinch(){
  const w=document.getElementById('boardWrap');let start=null;
  const dist=ts=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
  w.addEventListener('touchstart',e=>{touchCount=e.touches.length;if(e.touches.length===2)start={d:dist(e.touches),z:zoom}},{passive:true});
  w.addEventListener('touchmove',e=>{if(e.touches.length===2&&start){e.preventDefault();applyZoom(start.z*dist(e.touches)/start.d,false)}},{passive:false});
  const end=e=>{touchCount=e.touches.length;if(start&&e.touches.length<2){start=null;local.zoom=zoom;saveLocal()}};

function renderViewBar(vk){

  if(weakHit.length)add('ath','ok',t('weakOk',weakHit.map(q=>t('q')[q]).join(', ')));
  if(pr.phase){
    let bad=false;
    if((pr.phase==='pc'||pr.phase==='c')&&(hi>2||rest===0)){add('ath','warn',t('phComp'),6);bad=true}
    if(pr.phase==='t'&&hi>0){add('ath','warn',t('phTrans'),6);bad=true}
    if(pr.phase==='gp'&&!hasAny(isEnd)&&!have.has('str_end')&&!have.has('str_max')){add('ath','warn',t('phGP'),5);bad=true}
    if(pr.phase==='sp'&&!(have.has('co_tech')&&(hasAny(isSpd)||have.has('str_speed')||have.has('str_react')))){add('ath','warn',t('phSP'),5);bad=true}
    const want=PHASE_STR[pr.phase];

      else add('ath','ok',t('phStrOk',pn))}
    if(!bad&&filled.length)add('ath','ok',t('phOk',t('phases')[pr.phase]));
  }
  return {score:Math.max(0,Math.min(100,score)),...out};
}

function applySide(){const w=document.getElementById('work'),o=sideIsOpen();w.classList.toggle('collapsed',!o);
  document.getElementById('sideFold').setAttribute('aria-expanded',o);
  document.querySelectorAll('#sideRail [data-rail]').forEach(b=>b.setAttribute('aria-current',b.dataset.rail===local.sideTab))}
function openSide(k){local.sideOpen=true;saveLocal();if(k)setSideTab(k);applySide()}
function goStep(k){
  if(k==='prof'){local.profOpen=true;saveLocal();renderProfile();document.getElementById('mc').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(k==='eval'){document.getElementById('btnDone').click();return}
  if(document.getElementById('work').classList.contains('collapsed'))openSide(k);else setSideTab(k);const tl=document.getElementById('tools');
  (tl.hidden?document.getElementById('boardWrap'):document.getElementById('work')).scrollIntoView({behavior:'smooth',block:'start'});
}

/* ================= editor ================= */
function openEditor(c,target){
  const m=document.getElementById('modal'),isNew=target==='new',S=()=>cur().days[target.i][target.s];
  m.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h3 id="dlgT">${isNew?t('edNew'):t('edDay',target.i+1,t('days')[target.i])+' · '+t(target.s)}</h3>
    <div class="field"><label for="ed-name">${t('edName')}</label><input id="ed-name" value="${esc(c.name)}" placeholder="${esc(t('edNamePh'))}"></div>
    <div class="field"><label for="ed-items">${t('edItems')}</label><textarea id="ed-items">${esc(c.items.join('\n'))}</textarea></div>
    <p class="hint">${t('edNote')}</p>
    <div class="dlg-actions">${isNew?'':`<button class="btn danger" id="ed-rm">${t('edRm')}</button><button class="btn" id="ed-swap">${t('changeCard')}</button>`}
      <button class="btn" id="ed-cancel">${t('cancel')}</button><button class="btn primary" id="ed-save">${t('save')}</button></div></div>`;
  m.classList.remove('sheet');m.hidden=false;if(!narrowMQ.matches)document.getElementById('ed-name').focus();
  const close=()=>{m.hidden=true;m.innerHTML=''};
  if(!isNew)document.getElementById('ed-swap').onclick=()=>{close();openPicker('content',target.i,{s:target.s,replace:target.bi})};
  m.onclick=e=>{if(e.target===m)close()};
  m.onkeydown=e=>{if(e.key==='Escape')close()};
  document.getElementById('ed-cancel').onclick=close;
  if(!isNew)document.getElementById('ed-rm').onclick=()=>{snap();S().blocks.splice(target.bi,1);close();commit();toastUndo(t('contentRemoved'))};
  document.getElementById('ed-save').onclick=()=>{
    const name=document.getElementById('ed-name').value.trim();
    const items=document.getElementById('ed-items').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!items.length){toast(t('needItems'));return}
    const p=cur();
    if(isNew){p.custom=p.custom||[];p.custom.push({id:'u'+Date.now(),name,items});toast(t('added'))}
    else{const B=S().blocks,old=B[target.bi];
      const same=old.ref&&name===c.name&&JSON.stringify(items)===JSON.stringify(c.items);
      B[target.bi]=same?{ref:old.ref,itemFor:old.itemFor||[],gs:old.gs}:{ref:null,name,items,gs:old.gs,itemFor:isSingle(old)?items.map(()=>[...((old.itemFor||[])[0]||[])]):(old.itemFor||[]).slice(0,items.length)};toast(t('saved'))}
    close();commit();
  };
}

function toast(msg,ms){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,ms||2600)}
function toastUndo(msg){const el=document.getElementById('toast');el.innerHTML=`<span>${esc(msg)}</span><button class="tbtn" type="button">${esc(t('undo'))}</button>`;el.hidden=false;
  el.querySelector('.tbtn').onclick=()=>{el.hidden=true;doUndo()};clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,4500)}
function copyText(txt,okMsg){
  const manual=()=>{const m=document.getElementById('modal');
    m.innerHTML=`<div class="dialog"><h3>${t('copyManual')}</h3><textarea id="cp" aria-label="${esc(t('copyManual'))}" style="min-height:260px;border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--bg)">${esc(txt)}</textarea><div class="dlg-actions"><button class="btn primary" id="cpx">${t('close')}</button></div></div>`;
    m.hidden=false;document.getElementById('cp').select();document.getElementById('cpx').onclick=()=>{m.hidden=true}};
  try{navigator.clipboard.writeText(txt).then(()=>toast(okMsg)).catch(manual)}catch(e){manual()}
}

function planText(){
  const p=cur(),pr=p.profile,{score}=evaluate(p),DN=t('days');
  let s=t('pTitle')+'\n';
  s+=local.mode==='group'?`${t('pGroup')}: ${group.code} ${p.name||''}\n${t('pMembers')}: ${p.members||'-'}\n`:`${t('pStudent')}: ${p.student||'-'}\n`;
  s+=`${t('pContext')}: ${p.context||'-'}\n`;
  s+=`${t('sex')}: ${pr.sex?(pr.sex==='M'?t('male'):t('female')):'-'} · ${t('event')}: ${pr.event||'-'} · ${t('pb')}: ${pr.pb||'-'} · ${t('goalPerf')}: ${pr.goal||'-'}\n`;
  s+=`${t('tage')}: ${pr.tage||'-'} · ${t('cage')}: ${pr.cage||'-'}\n`;
  s+=`${t('levelsT')}: ${QS.map(q=>`${t('q')[q]} ${pr.levels[q]||'-'}`).join(', ')}\n`;
  s+=`${t('macro')}: ${pr.macro||'-'} · ${t('period')}: ${pr.period?t('periods')[pr.period]:'-'} · ${t('phase')}: ${pr.phase?t('phases')[pr.phase]:'-'} · ${t('meso')}: ${pr.meso||'-'} · ${t('micro')}: ${pr.micro||'-'}\n`;
  s+=VOLS.map(k=>`∑${vU(k)} ${volSum(p.days,k)}`).join(' · ')+'\n\n';
  p.days.forEach((d,i)=>{
    s+=`${t('pDay',i+1,DN[i])} | ${t('rLoad')}: ${d.load?lT(d.load):'-'} | ${VOLS.map(k=>`${vU(k)} ${d.vol[k]??'-'}`).join(' ')}\n`;
    SESS.forEach(ss=>{const S=d[ss];
      if(isRestS(S)){s+=`  ${t(ss)}: ${t('sessRest')}\n`;return}
      s+=`  ${t(ss)} — ${t('sG')}: ${S.goals.map(gT).join(' → ')||'-'}\n`;
      S.blocks.forEach((b,bi)=>{const c=dispC(b),tg=blockTags(S,bi);s+=`    ▸ ${blkGS(b)?'['+blkGS(b)+'] ':''}${c.name||c.items[0]||'-'}${tg.length?` [${tg.map(gT).join(', ')}]`:''}\n${c.items.map(x=>'      • '+x).join('\n')}\n`})});
    s+='\n'});
  return s+`${t('pScore')}: ${score}/100\n\n${t('copyright')}`;
}

/* ================= teacher ================= */
function teacherRows(tab=tv.tab){
  if(tab==='groups')return groupsList.map(g=>({key:'g:'+g.code,kind:'g',id:g.code,title:g.name||t('noName'),sub:g.members||t('noMembers'),members:g.members||'',profile:g.profile,days:g.days,time:g.updatedAt,grade:tData.ggrades[g.code]||null}));
  return tData.indiv.map(x=>({key:'i:'+x.id,kind:'i',id:x.id,title:x.student||t('noName'),sub:x.context||'',members:'',profile:x.profile,days:x.days,time:x.submittedAt,grade:tData.grades[x.id]||null}));
}
function enrich(r){const ev=evaluate(r),auto=ev.score;return{...r,ev,auto,rub:rubricPct(r.grade),fin:finalScore(auto,r.grade),
  placed:r.days.filter(hasTraining).length,gN:r.days.filter(d=>dayGoals(d).length).length,lN:r.days.filter(d=>d.load).length,
  stale:!!(r.grade&&r.grade.at&&r.time&&r.time>r.grade.at)}}

  keepTyping(()=>{
  el.innerHTML=`<div class="t-head"><div><h2>${t('tTitle')}</h2><p class="hint"><span class="dot live"></span>${t('tLive')} · ${t('formula')}</p></div>
      <div class="tabs" role="tablist"><button role="tab" data-tab="groups" aria-selected="${tv.tab==='groups'}">${t('tabGroups')} (${groupsList.length})</button><button role="tab" data-tab="indiv" aria-selected="${tv.tab==='indiv'}">${t('tabIndiv')} (${tData.indiv.length})</button><button role="tab" data-tab="speed" aria-selected="${SP}">${esc(sT('tTab'))} (${tData.spd.length})</button></div></div>
    <div class="stats"><div class="stat"><span>${t('tCount')}</span><strong>${n}</strong></div>
      <div class="stat"><span>${t('tAvg')}</span><strong>${n?avg:'-'}</strong></div>
      <div class="stat"><span>${t('tGraded')}</span><strong>${graded}/${n}</strong></div>
      <div class="stat"><span>${t('tLow')}</span><strong style="color:${low?'var(--bad)':'inherit'}">${low}</strong></div></div>
    <section class="panel export"><h3>${t('exportT')}</h3>
      <div class="export-row"><div class="fld"><label for="sheetFolder">${t('folder')}</label><input id="sheetFolder" value="${esc(local.sheetFolder||'')}" placeholder="${esc(t('folderPh'))}" inputmode="url"></div>
      <button class="btn primary" id="toSheet">${t('toSheet')}</button><button class="btn" id="copyTsv">${t('copyTsv')}</button></div>
      <p class="hint">${t('sheetNote')}</p><div id="sheetStatus" aria-live="polite">${tv.sheetMsg||''}</div></section>
    <div class="t-tools"><label for="tSort">${t('tSort')}</label><select id="tSort">${Object.keys(sortKeys).map(k=>`<option value="${k}"${tv.sort===k?' selected':''}>${t(sortKeys[k])}</option>`).join('')}</select>
      <button class="btn small" id="tToggleAll">${n&&rows.every(r=>tv.open.has(r.key))?t('tCollapseAll'):t('tExpandAll')}</button></div>
    ${n?'':`<p class="hint">${SP?esc(sT('tEmpty')):tv.tab==='groups'?t('tEmptyG'):t('tEmptyI')}</p>`}
    ${rows.map(r=>SP?teacherRowS(r):teacherRow(r,bar)).join('')}`;
  });
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tv.tab=b.dataset.tab;local.tTab=tv.tab;saveLocal();renderTeacher()});
  document.getElementById('tSort').onchange=e=>{tv.sort=e.target.value;local.tSort=tv.sort;saveLocal();renderTeacher()};
  document.getElementById('tToggleAll').onclick=()=>{if(rows.every(r=>tv.open.has(r.key)))rows.forEach(r=>tv.open.delete(r.key));else rows.forEach(r=>tv.open.add(r.key));renderTeacher()};
  document.getElementById('sheetFolder').oninput=e=>{local.sheetFolder=e.target.value;saveLocal()};

  document.getElementById('copyTsv').onclick=()=>copyText(exportRows().map(r=>r.map(c=>String(c).replace(/[\t\n\r]+/g,' ')).join('\t')).join('\n'),t('tsvCopied'));

function draftFor(key){
  if(!tv.drafts[key]){const r=teacherRows('groups').concat(teacherRows('indiv'),spdRows()).find(x=>x.key===key),g=r&&r.grade;tv.drafts[key]={r:g&&Array.isArray(g.r)?[...g.r]:[0,0,0,0],comment:(g&&g.comment)||''}}
  return tv.drafts[key];
}
const safeId=k=>k.replace(/[^A-Za-z0-9_-]/g,'_');
function teacherRow(r,bar){
  const open=tv.open.has(r.key),pr=r.profile;
  const status=r.rub!=null?(r.stale?`<span class="pill warn">${t('resub')}</span>`:`<span class="pill ok">${t('graded')}</span>`):`<span class="pill">${t('notGraded')}</span>`;
  const meta=[esc(r.sub),pr.event?esc(pr.event):'',pr.sex?(pr.sex==='M'?t('male'):t('female')):'',pr.phase?esc(t('phases')[pr.phase]):'',pr.micro?`${t('micro')} ${esc(pr.micro)}`:'',
    `${r.kind==='g'?t('tUpdated'):t('tSubmittedAt')} ${esc(fmtTime(r.time))}`].filter(Boolean).join(' · ');
  return `<article class="grow">
    <div class="grow-top"><div style="min-width:0"><h3>${r.kind==='g'?`<code>${esc(r.id)}</code>`:''}${esc(r.title)} ${status}</h3>
      <div class="gmeta">${meta}</div>
      <div class="prog">${bar(t('sG'),r.gN)}${bar(t('sC'),r.placed)}${bar(t('sL'),r.lN)}<span>${VOLS.map(k=>`∑${vU(k)} ${volSum(r.days,k)}`).join(' · ')}</span></div></div>
      <div><div class="scores"><div><span>${t('autoS')}</span><strong style="color:${scoreCol(r.auto)}">${r.auto}</strong></div>
        <div><span>${t('teachS')}</span><strong>${r.rub??'–'}</strong></div><div><span>${t('finalS')}</span><strong style="color:${r.fin!=null?scoreCol(r.fin):'inherit'}">${r.fin??'–'}</strong></div></div>
      <div class="grow-btns"><button class="btn small" data-open="${esc(r.key)}" aria-expanded="${open}">${open?t('tHide'):t('tView')}</button>
      <button class="btn small danger" data-delg="${esc(r.key)}">${tv.delArm===r.key?t('tDelC'):t('tDel')}</button></div></div></div>
    ${open?miniPlan(r)+rubricForm(r):''}</article>`;
}
function miniPlan(r){
  const DN=t('days'),pr=r.profile;
  return `<div class="pinfo"><span>${t('pb')}: <b>${esc(pr.pb||'-')}</b></span><span>${t('goalPerf')}: <b>${esc(pr.goal||'-')}</b></span><span>${t('tage')}: <b>${esc(pr.tage||'-')}</b></span><span>${t('cage')}: <b>${esc(pr.cage||'-')}</b></span>
      <span>${t('macro')}: <b>${esc(pr.macro||'-')}</b></span><span>${t('period')}: <b>${pr.period?esc(t('periods')[pr.period]):'-'}</b></span><span>${t('meso')}: <b>${esc(pr.meso||'-')}</b></span></div>
    <div class="pinfo"><span>${t('levelsT')}:</span>${QS.map(q=>`<span>${t('q')[q]} <b>${pr.levels[q]||'-'}</b></span>`).join('')}</div>
    <div class="mini-scroll"><div class="mini">${r.days.map((d,i)=>`<div class="mcol"><div class="dh">${i+1} · ${DN[i]}</div>
      ${SESS.map(s=>sessCell(d,i,s,false)).join('')}
      ${d.load?`<div class="mload" data-load="${d.load}">${lT(d.load)}</div>`:'<div class="mload none">—</div>'}
      <div class="mv">${VOLS.map(k=>`${vU(k)} ${d.vol[k]??'–'}`).join(' · ')}</div></div>`).join('')}</div></div>
    <div class="eval" style="grid-template-columns:1fr"><div style="min-width:0">${evalLists(r.ev)}</div></div>`;
}
function rubricForm(r,labels=t('rub')){
  const d=draftFor(r.key),ok=d.r.every(v=>v>=1),pct=ok?Math.round(d.r.reduce((a,b)=>a+b,0)/20*100):null;
  return `<div class="rub"><h4>${t('rubT')}</h4>
    ${labels.map((c,i)=>`<div class="rub-row"><span>${i+1}. ${c}</span><div class="rub-opts" role="group" aria-label="${esc(c)}">${[1,2,3,4,5].map(v=>`<button data-rk="${esc(r.key)}" data-ri="${i}" data-rv="${v}" aria-pressed="${d.r[i]===v}">${v}</button>`).join('')}</div></div>`).join('')}
    <div class="fld"><label for="cm-${safeId(r.key)}">${t('comment')}</label><textarea id="cm-${safeId(r.key)}" data-cm="${esc(r.key)}">${esc(d.comment)}</textarea></div>
    <div class="rub-foot"><span>${t('teachS')} <b>${pct??'–'}</b> · ${t('finalS')} <b>${pct!=null?Math.round(r.auto*0.4+pct*0.6):'–'}</b> · ${t('formula')}</span>
      <button class="btn primary small" data-save="${esc(r.key)}">${t('saveGrade')}</button></div></div>`;
}
async function saveGrade(key,r){
  const d=draftFor(key);if(!d.r.every(v=>v>=1)){toast(t('rubNeed'));return}
  const path=(r.kind==='g'?'ggrades/':r.kind==='s'?'wsgspeed/':'grades/')+r.id;
  try{await db.doc(path).set({r:[...d.r],comment:d.comment.trim(),auto:r.auto,at:Date.now()});delete tv.drafts[key];toast(t('gradeSaved'))}
  catch(e){toast(t('gradeFail'))}
}
function exportRows(){
  // แท็บชิ้นงานความเร็ว: ส่งออกเฉพาะชิ้นงานนี้
  if(tv.tab==='speed')return [sT('cols'),...spdRows().map(r=>{const g=r.grade||{};return[r.title,r.id.slice(0,8),r.x.pb||'',r.pro?sT('lvPro'):sT('lvNew'),(r.x.rows||[]).length,spdTotal(r.x.rows),r.auto,
    ...(Array.isArray(g.r)?g.r:['','','','']),r.rub??'',r.fin??'',g.comment||'',fmtTime(r.time),g.at?fmtTime(g.at):'']})];
  const all=[];
  ['groups','indiv'].forEach(tab=>teacherRows(tab).map(enrich).forEach(r=>{const pr=r.profile,g=r.grade||{};
    all.push([r.kind==='g'?t('group'):t('indiv'),r.kind==='g'?r.id:r.id.slice(0,8),r.title,r.members,pr.event,pr.sex?(pr.sex==='M'?t('male'):t('female')):'',pr.phase?t('phases')[pr.phase]:'',pr.micro,
      ...VOLS.map(k=>volSum(r.days,k)),r.placed,r.gN,r.lN,r.auto,...(Array.isArray(g.r)?g.r:['','','','']),r.rub??'',r.fin??'',g.comment||'',fmtTime(r.time),g.at?fmtTime(g.at):''])}));
  return [t('cols'),...all];
}
const csvCell=v=>{const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
async function exportSheet(){
  const st=document.getElementById('sheetStatus'),btn=document.getElementById('toSheet');
  const setMsg=h=>{tv.sheetMsg=h;st.innerHTML=h};
  let mcp=null;try{mcp=window.claude?await window.claude.use('mcp'):null}catch(e){}
  if(!mcp){setMsg(t('sheetNoMcp'));return}
  const csv=exportRows().map(r=>r.map(csvCell).join(',')).join('\n');
  const title=(tv.tab==='speed'?sT('tTab')+' · ':'')+t('sheetTitle',new Date().toLocaleString(HTML_LANG[lang],{dateStyle:'medium',timeStyle:'short'}));
  const fs=(local.sheetFolder||'').trim(),fm=fs.match(/folders\/([A-Za-z0-9_-]+)/)||fs.match(/^([A-Za-z0-9_-]{15,})$/);
  const input={title,textContent:csv,contentMimeType:'text/csv'};if(fm)input.parentId=fm[1];
  btn.disabled=true;setMsg(t('sheetMaking'));
  try{
    const res=await mcp.callTool('Google Drive','create_file',input);
    const p=res&&res.payload,f=p&&typeof p==='object'?(p.file||p):null;
    const id=f&&(f.id||f.fileId);
    const link=f&&(f.webViewLink||f.alternateLink||f.url)||(id?'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id):null);
    setMsg(link&&/^https:\/\//.test(link)?`<span class="dot live"></span>${t('sheetDone')} · <a href="${esc(link)}" target="_blank" rel="noopener">${t('openSheet')} ↗</a>`:`<span class="dot live"></span>${t('sheetDoneNoLink')} "${esc(title)}"`);
  }catch(e){
    const c=e&&e.code;
    setMsg('<span class="dot off"></span>'+(c==='server_not_connected'||c==='selection_required'||c==='server_not_found'?t('sheetConnect'):c==='needs_reauth'?t('sheetReauth')
      :c==='not_in_manifest'||c==='approval_required'||c==='blocked_by_policy'?t('sheetDenied'):c==='server_unavailable'||c==='upstream_error'||c==='cancelled'?t('sheetUnsure')
      :c==='not_granted'||c==='capability_disabled'||c==='capability_removed'?t('sheetNoMcp'):esc(t('sheetFail',(e&&e.message)||c||''))));
  }
  btn.disabled=false;
}

  if(m==='group'&&group.code&&!group.plan)joinGroup(group.code);else renderAll()}
document.getElementById('mIndiv').onclick=()=>setMode('indiv');
